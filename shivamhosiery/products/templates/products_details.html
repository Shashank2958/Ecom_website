{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'products/css/products_details.css' %}">
{% endblock %}

{% block content %}
<div class="product-detail-container">

    <div class="product-image">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    </div>

    <div class="product-info">
        <h1>{{ product.name }}</h1>

        <p class="price">₹ {{ product.retail_price }}</p>

        <p class="description">
            {{ product.Description }}
        </p>

        {% if product.is_available %}
        <a href="{% url 'add_to_cart' product.id %}" class="cart-btn">Add to Cart 🛒</a>
        <a href="{% url 'buy_now' product.id %}" class="buy-btn">Buy Now</a>
        {% else %}
        <p class="out-of-stock">Out of Stock</p>
        {% endif %}
    </div>

</div>
{% endblock %}
